name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: deVich27
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=custom&color_snake=#000000&color_dots=#eeeeee,#cccccc,#999999,#555555,#000000
